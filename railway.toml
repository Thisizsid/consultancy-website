# Single-service deployment: one Railway service builds the frontend and
# runs the Express backend, which serves both (see server/index.js). With no
# config here, Railway's Nixpacks auto-detection treats this repo as a
# static Vite site and never starts the backend at all — every POST/PUT
# request (login, password reset, CMS writes, ...) 404s or 405s even though
# the site loads fine, since GETs are served by the static host.
#
# Two package.json trees need installing: the root one (frontend) and
# server/ (backend, its own dependencies). Nixpacks auto-installs the root
# one on its own before buildCommand ever runs (visible as "npm install
# cached" in build logs) — re-running `npm ci` here on top of that collided
# with the already-populated node_modules (EBUSY on node_modules/.vite,
# since `ci` first wipes node_modules before reinstalling). So this only
# needs to build the frontend and install server/'s separate deps.

[build]
buildCommand = "npm run build && npm --prefix server ci"

[deploy]
startCommand = "npm run server"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
